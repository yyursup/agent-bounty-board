[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
# Public immutables are part of the ABI (rewardToken(), agentId(), maxReward()); keep them camelCase.
exclude_lints = ["screaming-snake-case-immutable"]

[fmt]
line_length = 110
bracket_spacing = false
